# ---- performance tuning with FULL durability guarantees ----
listen_addresses = ''
port = 5499
max_connections = 40

# durability: asynchronous commit. COMMIT does not wait for fsync; the walwriter
# flushes WAL every wal_writer_delay (Field: the flusher msyncs the log every 10 ms).
# The loss window on a crash is the same, and database integrity is preserved.
fsync = on
synchronous_commit = off
full_page_writes = on
wal_sync_method = fdatasync

# WAL
wal_level = minimal
max_wal_senders = 0
wal_compression = lz4
wal_buffers = 64MB
wal_writer_delay = 10ms
wal_init_zero = off
wal_recycle = on
min_wal_size = 512MB
max_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# IO
effective_io_concurrency = 256
maintenance_io_concurrency = 256
random_page_cost = 1.1
bgwriter_delay = 10ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0

# planner / misc
jit = off
work_mem = 16MB
huge_pages = try
track_io_timing = off

# background cleanup: aggressive autovacuum
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1s
autovacuum_vacuum_scale_factor = 0.01
autovacuum_vacuum_threshold = 1000
autovacuum_vacuum_insert_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 0
autovacuum_vacuum_cost_limit = 10000
